<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Alyssa Nkolo — Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio d'Alyssa Nkolo — Développeuse full-stack, formatrice IA, engagée avec WISTEM. Projets, stack technique, contenu tech.">
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/alyssa.jpg" fetchpriority="high">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('portfolio-theme');
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
